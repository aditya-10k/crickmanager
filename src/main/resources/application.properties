spring.application.name=cricmanager-backend

# Database — driven by HuggingFace secrets (or docker-compose env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cricmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cricuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cricpassword}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port — HuggingFace Spaces requires 7860
server.port=${SERVER_PORT:7860}

# CORS — allow Firebase frontend and local dev
spring.web.cors.allowed-origins=https://cricmanagernow.web.app,https://cricmanagernow.firebaseapp.com,http://localhost:3000

# File paths — bundled inside the Docker image
cricmanager.data.players-csv=/app/Output/player_season_values.csv
cricmanager.data.squads-csv=/app/Output/historical_squad_values.csv

# Hibernate batch processing config
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

